  eye('glmKey','glmEye');eye('gemKey','gemEye');
  $('#glmKey').oninput=e=>{prefs.providers.glm.key=e.target.value.trim();savePrefs();afterKey()};
  $('#gemKey').oninput=e=>{prefs.providers.gemini.key=e.target.value.trim();savePrefs();afterKey()};
  $('#glmEp').oninput=e=>{prefs.providers.glm.endpoint=e.target.value.trim();savePrefs()};
  $('#gemEp').oninput=e=>{prefs.providers.gemini.endpoint=e.target.value.trim();savePrefs()};
  $('#glmP1').onclick=()=>{$('#glmEp').value='https://open.bigmodel.cn/api/paas/v4/chat/completions';prefs.providers.glm.endpoint=$('#glmEp').value;savePrefs()};
  $('#glmP2').onclick=()=>{$('#glmEp').value='https://api.z.ai/api/paas/v4/chat/completions';prefs.providers.glm.endpoint=$('#glmEp').value;savePrefs()};
  $('#glmTest').onclick=()=>testProvider('glm');
  $('#gemTest').onclick=()=>testProvider('gemini');
  $('#addGlm').onclick=()=>{prefs.models.push({k:uid(),provider:'glm',id:'',vision:false});savePrefs();renderModelList(true)};
  $('#addGem').onclick=()=>{prefs.models.push({k:uid(),provider:'gemini',id:'',vision:true});savePrefs();renderModelList(true)};
  $('#setTemp').oninput=e=>{prefs.temperature=+e.target.value;$('#tempV').textContent=e.target.value;savePrefs()};
  $('#setSteps').oninput=e=>{prefs.maxSteps=Math.max(1,Math.min(20,+e.target.value||10));savePrefs()};
  $('#setTok').oninput=e=>{prefs.maxTokens=Math.max(1024,+e.target.value||16384);savePrefs()};
  $('#setBe').oninput=e=>{prefs.backendUrl=e.target.value.trim();savePrefs();renderSysline()};
  $('#togVia').onclick=e=>{
    if(!prefs.viaBackend&&!prefs.backendUrl){toast('Set the backend URL first');return}
    prefs.viaBackend=!prefs.viaBackend;savePrefs();e.currentTarget.classList.toggle('on',prefs.viaBackend);
  };
  $('#togTerm').onclick=e=>{prefs.terminal.localSandbox=!prefs.terminal.localSandbox;savePrefs();e.currentTarget.classList.toggle('on',prefs.terminal.localSandbox)};
  $('#beSetup').onclick=showBackendSetup;
  $('#bePing').onclick=async()=>{
    const st=$('#beStatus');
    if(!prefs.backendUrl){st.textContent='Set a URL first.';return}
    st.textContent='Pinging…';
    try{
      const r=await fetch(prefs.backendUrl.replace(/\/$/,'')+'/api/health');
      const j=await r.json();
      st.textContent=j.ok?'Backend online — '+j.service:'Unexpected response';
    }catch(e){st.textContent='Unreachable — '+e.message}
  };
  ['dHost','dPort','dUser','dPass','dRoot','dDomain'].forEach(id=>{
    $('#'+id).oninput=()=>{
      prefs.deployDefaults=Object.assign(prefs.deployDefaults,{host:$('#dHost').value.trim(),port:$('#dPort').value.trim(),username:$('#dUser').value.trim(),password:$('#dPass').value,remoteRoot:$('#dRoot').value.trim()||'/public_html',domain:$('#dDomain').value.trim()});
      savePrefs();
    };
  });
  $('#expAll').onclick=()=>{
    const dump={exportedAt:new Date().toISOString(),projects:projects,prefs:JSON.parse(JSON.stringify(prefs))};
    dump.prefs.providers.glm.key='';dump.prefs.providers.gemini.key='';dump.prefs.deployDefaults.password='';
    projects.forEach(p=>{dump['files_'+p.id]=pFiles(p.id)});
    dl(new Blob([JSON.stringify(dump,null,2)],{type:'application/json'}),'xenom-export.json');
    toast('Exported (keys and passwords excluded)');
  };
  $('#wipeAll').onclick=()=>{
    confirmDlg('Erase everything','All projects, files, chats, API keys and settings will be permanently deleted from this browser.','Erase all',()=>{
      const keys=[];
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('xenom:')===0)keys.push(k)}
      keys.forEach(k=>localStorage.removeItem(k));
      location.reload();
    });
  };
  renderModelList();
}
function renderModelList(focusLast){
  const box=$('#modelList');if(!box)return;
  box.innerHTML='';
  prefs.models.forEach((m,i)=>{
    const row=document.createElement('div');row.className='model-row';
    row.innerHTML='<button class="iconbtn" style="width:30px;height:30px" data-v="'+i+'" title="Vision capable" aria-label="Toggle vision">'+I(m.vision?'eye':'eyeOff',15)+'</button>'
      +'<span class="chip">'+providerLabel(m.provider)+'</span>'
      +'<div class="mid"><input value="'+esc(m.id)+'" data-id="'+i+'" placeholder="model id" aria-label="Model id" autocapitalize="off" spellcheck="false"></div>'
      +(prefs.current===m.k?'<span class="chip" style="color:var(--ok);border-color:var(--ok)">active</span>':'<button class="iconbtn" style="width:30px;height:30px" data-use="'+i+'" title="Make active" aria-label="Make active">'+I('check',15)+'</button>')
      +'<button class="iconbtn" style="width:30px;height:30px" data-del="'+i+'" title="Remove" aria-label="Remove">'+I('trash',15)+'</button>';
    box.appendChild(row);
  });
  box.querySelectorAll('input[data-id]').forEach(inp=>{inp.oninput=()=>{prefs.models[+inp.dataset.id].id=inp.value.trim();savePrefs();if(cur)updateModelChip()}});
  box.querySelectorAll('[data-v]').forEach(b=>{b.onclick=()=>{const m=prefs.models[+b.dataset.v];m.vision=!m.vision;savePrefs();renderModelList()}});
  box.querySelectorAll('[data-use]').forEach(b=>{b.onclick=()=>{const m=prefs.models[+b.dataset.use];if(!m.id){toast('Enter a model ID first');return}prefs.current=m.k;savePrefs();if(cur)updateModelChip();renderModelList()}});
  box.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=()=>{
      if(prefs.models.length<=1){toast('Keep at least one model');return}
      const rem=prefs.models.splice(+b.dataset.del,1)[0];
      if(prefs.current===rem.k)prefs.current=prefs.models[0].k;
      savePrefs();if(cur)updateModelChip();renderModelList();
    };
  });
  if(focusLast){const ins=box.querySelectorAll('input[data-id]');if(ins.length){const l=ins[ins.length-1];l.focus()}}
}

/* =====================================================================
   BOOT
   ===================================================================== */
$('#workTitle').textContent='—';
applyTheme();
renderDashboard();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#modal').classList.contains('on')){closeModal();return}
    closeSheet();closeDrawer();
  }
});
window.addEventListener('beforeunload',()=>{try{flushEditor();if(cur)saveChatState()}catch(e){}});
console.log('XENOM ready');
</script>
</body>
